<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freelancers | HustleHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/jobs.css">
  <link rel="stylesheet" href="css/freelancers.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">HustleHub</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="jobs.html">Jobs</a></li>
          <li><a href="freelancers.html" class="active">Freelancers</a></li>
          <li><a href="post-job.html">Post a Job</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page-header">
      <h1>Find talent</h1>
      <p>Sample freelancer profiles for the demo. Real profiles need accounts and a backend.</p>
    </section>

    <div class="search-box">
      <label for="search">Search by name, skill or country</label>
      <input type="search" id="search" placeholder="e.g. design, HTML, Nigeria">
    </div>

    <p id="freelancer-count"></p>
    <section id="freelancer-list"></section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>Find opportunities. Show your skills. Get work done.</p>
      <p>HustleHub is a demo prototype. Listings are sample data.</p>
    </div>
  </footer>

  <script src="js/freelancers.js"></script>
  <script src="js/menu.js"></script>
